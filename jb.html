<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABAS4D - Jailbreak</title>
<style>
  * { box-sizing: border-box; }
  body { 
    margin: 0; 
    padding: 0; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b0d10 url('bg.jpg') no-repeat center center fixed;
    background-size: cover;
    color: #c8ced8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10, 12, 16, 0.75);
    z-index: 1;
  }
  #wrap { 
    position: relative;
    z-index: 2;
    padding: 25px 20px; 
    background: rgba(14, 17, 22, 0.88); 
    margin: 20px auto; 
    width: 90%;
    max-width: 500px;
    border-radius: 12px; 
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    text-align: center;
  }
  .brand-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 5px;
  }
  .brand-header img {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #7fd0a0;
  }
  .brand-header b {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #ffffff;
  }
  .sub-name {
    font-size: 18px;
    color: #e2e8f0;
    margin-bottom: 15px;
    font-weight: bold;
  }
  #state { font-size: 20px; font-weight: 700; margin: 10px 0; color: #7fd0a0; }
  #log { 
    font-size: 13px; 
    color: #cbd5e0; 
    margin-top: 10px; 
    white-space: pre-wrap; 
    word-break: break-all;
    background: rgba(0,0,0,0.5);
    padding: 10px;
    border-radius: 8px;
    text-align: left;
    max-height: 150px;
    overflow-y: auto;
  }
  .err { color: #fc8181; font-weight: bold; }
</style>
</head>
<body>
<div class="overlay"></div>
<div id="wrap">
  <div class="brand-header">
    <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
    <b>ABAS4D</b>
  </div>
  <div class="sub-name">عباس محمود</div>
  <div id="state">running jailbreak...</div>
  <div id="log">Loading exploit module...</div>
</div>

<script>
  function logMsg(msg, isErr) {
    var l = document.getElementById("log");
    if (l) {
      l.innerHTML += "<br>" + (isErr ? "<span class='err'>" + msg + "</span>" : msg);
    }
  }
  window.onerror = function(msg, url, line) {
    logMsg("Error: " + msg + " (Line: " + line + ")", true);
    var st = document.getElementById("state");
    if (st) { st.textContent = "JAILBREAK FAILED"; st.style.color = "#fc8181"; }
  };
</script>

<!-- استدعاء ملف jb.js الرئيسي فقط ليتولى تحميل الموديولات بالترتيب -->
<script type="module" src="jb.js" onerror="logMsg('Failed to load jb.js module', true)"></script>
</body>
</html>
