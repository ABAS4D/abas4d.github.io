<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<meta name="theme-color" content="#05070a">

<title>ABAS4D — Jailbreak</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;

  overflow: hidden;

  background:
    linear-gradient(
      rgba(0,0,0,.72),
      rgba(0,0,0,.72)
    ),
    url("bg.jpg") center center / cover no-repeat;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color: white;

  touch-action: none;
  overscroll-behavior: none;
}

.overlay {
  position: fixed;
  inset: 0;

  background:
    radial-gradient(
      circle at center,
      rgba(0,255,136,.08),
      transparent 55%
    );

  pointer-events: none;
}

#wrap {
  position: fixed;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  width: min(88vw, 520px);

  padding: 28px 24px;

  text-align: center;

  border-radius: 22px;

  background:
    rgba(5, 8, 12, .88);

  border:
    1px solid rgba(0,255,136,.22);

  box-shadow:
    0 0 35px rgba(0,0,0,.65),
    0 0 25px rgba(0,255,136,.08);

  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);

  z-index: 2;
}

.brand-header {
  display: flex;

  align-items: center;
  justify-content: center;

  gap: 14px;

  margin-bottom: 8px;
}

.brand-header img {
  width: 52px;
  height: 52px;

  border-radius: 50%;

  object-fit: cover;

  border: 2px solid #00ff88;

  box-shadow:
    0 0 12px rgba(0,255,136,.4);
}

.brand-header b {
  font-size: 26px;

  font-weight: 800;

  letter-spacing: 2px;

  color: #fff;
}

.sub-name {
  margin-bottom: 22px;

  font-size: 16px;

  font-weight: 600;

  color: #8b95a3;
}

#msg {
  min-height: 38px;

  margin: 8px 0;

  font-size: 25px;

  font-weight: 800;

  letter-spacing: 1px;

  color: #fff;
}

#state {
  min-height: 22px;

  margin-top: 8px;

  font-size: 13px;

  color: #8b95a3;
}

#log,
#out {
  display: none;
}

body.done #msg {
  color: #39e879;
}

body.fail #msg {
  color: #ff3b3b;
}

</style>
</head>


<body>

<div class="overlay"></div>

<div id="wrap">

  <div class="brand-header">

    <img
      src="logo.png"
      alt="ABAS4D"
      onerror="this.style.display='none'"
    >

    <b>ABAS4D</b>

  </div>

  <div class="sub-name">
    عباس محمود
  </div>

  <div id="msg">
    RUNNING
  </div>

  <div id="state"></div>

  <div id="log"></div>

  <div id="out"></div>

</div>


<script>
(function () {

  /*
   * UI فقط.
   * لا يوجد fetch.
   * لا يوجد Date.now().
   * لا يوجد تحميل ديناميكي لـ jb.js.
   * jb.js يبقى مسؤولاً عن البرنامج نفسه.
   */

  var msg = document.getElementById("msg");
  var state = document.getElementById("state");

  if (msg) {
    msg.textContent = "RUNNING";
  }

  if (state) {
    state.textContent = "";
  }

  /*
   * منع حركة الصفحة بسبب Stick Drift / اللمس.
   */

  document.addEventListener(
    "touchmove",
    function (e) {
      e.preventDefault();
    },
    { passive: false }
  );

  document.addEventListener(
    "gesturestart",
    function (e) {
      e.preventDefault();
    },
    { passive: false }
  );

})();
</script>


<!--
  مهم:
  هذا هو التحميل المباشر لـ jb.js.
  لا نستخدم fetch ولا URL متغير.
-->

<script
  type="module"
  src="jb.js">
</script>


</body>
</html>
