<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ABAS4D - Running</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
}

body {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        #090b10 url("bg.jpg")
        center center / cover no-repeat;

    color: #fff;

    font-family:
        Arial,
        Tahoma,
        sans-serif;

    touch-action: none;
    overscroll-behavior: none;
}

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(5,7,12,.80);
    pointer-events: none;
}

.panel {
    position: fixed;

    left: 50%;
    top: 50%;

    width: 90%;
    max-width: 460px;

    transform: translate(-50%, -50%);

    padding: 32px 25px;

    background: rgba(19,23,32,.96);

    border: 1px solid rgba(255,255,255,.15);
    border-radius: 18px;

    text-align: center;

    box-shadow:
        0 15px 45px rgba(0,0,0,.7);

    z-index: 2;
}

.logo {
    width: 60px;
    height: 60px;

    object-fit: cover;
    border-radius: 50%;

    margin-bottom: 12px;
}

.brand {
    font-size: 27px;
    font-weight: 800;

    margin-bottom: 25px;
}

#message {
    font-size: 24px;
    font-weight: 800;

    min-height: 35px;
}

#details {
    margin-top: 12px;

    color: #9ba3af;

    font-size: 14px;
    line-height: 1.7;
}

.spinner {
    width: 34px;
    height: 34px;

    margin: 22px auto;

    border: 4px solid rgba(255,255,255,.18);

    border-top-color: #fff;
    border-right-color: #fff;

    border-radius: 50%;

    animation: spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

#run {
    width: 100%;

    margin-top: 24px;
    padding: 15px;

    border: 0;
    border-radius: 10px;

    background: #00c875;
    color: #07120d;

    font-size: 20px;
    font-weight: 800;
}

#run:disabled {
    opacity: .45;
}

.ok {
    color: #39e879;
}

.warn {
    color: #ffd43b;
}

.bad {
    color: #ff5252;
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="panel">

    <img
        src="logo.png"
        class="logo"
        alt="ABAS4D"
        onerror="this.style.display='none'"
    >

    <div class="brand">
        ABAS4D
    </div>

    <div id="message" class="ok">
        جاهز للتشغيل
    </div>

    <div id="spinner"
         class="spinner"
         style="display:none">
    </div>

    <div id="details">
        الصفحة محمّلة من الكاش.
    </div>

    <button id="run">
        اضغط X للبدء
    </button>

</div>

<script>
(function () {

"use strict";

var message =
    document.getElementById("message");

var details =
    document.getElementById("details");

var spinner =
    document.getElementById("spinner");

var run =
    document.getElementById("run");


function start() {

    if (run.disabled)
        return;

    run.disabled = true;

    message.textContent =
        "جاري التشغيل...";

    message.className =
        "warn";

    details.textContent =
        "انتظر...";

    spinner.style.display =
        "block";

    /*
     * اسم ثابت حتى يبقى متوافق
     * مع AppCache.
     */

    var script =
        document.createElement("script");

    script.type = "module";
    script.src = "jb.js";

    script.onerror = function () {

        spinner.style.display =
            "none";

        message.textContent =
            "تعذر تحميل jb.js";

        message.className =
            "bad";

        details.textContent =
            "تأكد أن jb.js موجود داخل الكاش.";

        run.disabled = false;
    };

    document.body.appendChild(script);
}


run.addEventListener(
    "click",
    start
);


document.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Enter" ||
            event.key === " "
        ) {
            start();
        }

    }
);


document.addEventListener(
    "touchmove",
    function (event) {
        event.preventDefault();
    },
    {
        passive: false
    }
);

})();
</script>

</body>
</html>
