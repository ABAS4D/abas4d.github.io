<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>ABAS4D - Jailbreak</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000 url("bg.jpg") center/cover no-repeat;
    font-family:Arial,Tahoma,sans-serif;
    color:#fff;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
}

#wrap{
    position:relative;
    z-index:2;
    width:90%;
    max-width:450px;
    padding:30px 20px;
    text-align:center;
    background:rgba(15,15,15,.94);
    border:1px solid rgba(255,255,255,.15);
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.7);
}

.logo{
    width:65px;
    height:65px;
    object-fit:cover;
    border-radius:50%;
    margin-bottom:12px;
}

.brand{
    font-size:27px;
    font-weight:bold;
    letter-spacing:2px;
}

.name{
    margin-top:5px;
    color:#999;
    font-size:15px;
}

.status{
    margin-top:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:13px;
    min-height:45px;
}

#msg{
    font-size:25px;
    font-weight:bold;
}

.spinner{
    width:28px;
    height:28px;
    border:4px solid rgba(255,255,255,.25);
    border-top-color:#fff;
    border-right-color:#fff;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

body.done .spinner,
body.fail .spinner{
    display:none;
}

body.done #msg{
    color:#39e879;
}

body.fail #msg{
    color:#ff3b3b;
}

#salawat{
    display:none;
    margin-top:12px;
    color:#39e879;
    font-weight:bold;
    font-size:16px;
}

body.done #salawat{
    display:block;
}

/*
هذه العناصر مطلوبة من jb.js
ولا نحذفها حتى لو ما تظهر للمستخدم.
*/

#state{
    display:none;
}

#log{
    display:none;
}

#out{
    display:none;
}

</style>

</head>

<body>

<div class="overlay"></div>

<div id="wrap">

    <img
        src="logo.png"
        class="logo"
        alt=""
        onerror="this.style.display='none'"
    >

    <div class="brand">
        ABAS4D
    </div>

    <div class="name">
        عباس محمود
    </div>

    <div class="status">

        <div class="spinner"></div>

        <div id="msg">
            جاري التشغيل...
        </div>

    </div>

    <div id="salawat">
        صلي على محمد (ﷺ)
    </div>

    <div id="state"></div>
    <div id="log"></div>
    <div id="out"></div>

</div>

<!-- لا نضيف أي Worker wrapper هنا -->
<script
    type="module"
    src="jb.js"
></script>

</body>

</html>
