<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>عباس محمود - ABAS4D</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;

  background: #05070a url('bg.jpg') no-repeat center center fixed;
  background-size: cover;

  color: #e6ebf2;

  font-family:
    "Segoe UI",
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    Roboto,
    sans-serif;
}

body {
  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;
}

.overlay {
  position: fixed;
  inset: 0;

  background:
    radial-gradient(
      circle at 50% 35%,
      rgba(0,255,136,0.08),
      transparent 35%
    ),
    rgba(3,5,8,0.78);

  z-index: 1;
}

#wrap {
  position: relative;
  z-index: 2;

  width: 90%;
  max-width: 470px;

  padding: 34px 26px 26px;

  background:
    linear-gradient(
      145deg,
      rgba(24,30,40,0.94),
      rgba(10,14,20,0.91)
    );

  border: 1px solid rgba(255,255,255,0.14);

  border-radius: 22px;

  text-align: center;

  box-shadow:
    0 25px 70px rgba(0,0,0,0.75),
    0 0 35px rgba(0,255,136,0.06);

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  animation: cardIn .7s ease;
}

#wrap::before {
  content: "";

  position: absolute;

  top: 0;
  left: 12%;

  width: 76%;
  height: 1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #00ff88,
      transparent
    );

  opacity: .8;
}

.brand-header {
  display: flex;

  align-items: center;
  justify-content: center;

  gap: 15px;

  margin-bottom: 7px;
}

.brand-header img {
  width: 58px;
  height: 58px;

  border-radius: 50%;

  object-fit: cover;

  border: 2px solid #00ff88;

  box-shadow:
    0 0 0 4px rgba(0,255,136,0.06),
    0 0 22px rgba(0,255,136,0.35);
}

.brand-header b {
  margin: 0;

  font-size: 29px;

  font-weight: 900;

  letter-spacing: 3px;

  color: #fff;

  text-shadow:
    0 0 18px rgba(255,255,255,0.12);
}

.sub-name {
  margin: 0 0 24px;

  font-size: 17px;

  font-weight: 700;

  color: #9ca8b8;

  letter-spacing: 1px;
}

#state {
  font-size: 21px;

  font-weight: 800;

  margin: 12px 0;

  min-height: 32px;

  color: #7fd0a0;

  text-shadow:
    0 0 14px rgba(127,208,160,0.18);
}

#log {
  font-size: 13px;

  color: #cbd5e0;

  margin-top: 14px;

  white-space: pre-wrap;

  word-break: break-all;

  background:
    linear-gradient(
      145deg,
      rgba(0,0,0,0.55),
      rgba(8,11,15,0.72)
    );

  padding: 14px;

  border-radius: 12px;

  border: 1px solid rgba(255,255,255,0.08);

  text-align: left;

  max-height: 190px;

  overflow-y: auto;

  box-shadow:
    inset 0 0 20px rgba(0,0,0,0.3);
}

#log::-webkit-scrollbar {
  width: 5px;
}

#log::-webkit-scrollbar-track {
  background: transparent;
}

#log::-webkit-scrollbar-thumb {
  background: rgba(0,255,136,0.35);
  border-radius: 10px;
}

.err {
  color: #fc8181;

  font-weight: bold;
}

@keyframes cardIn {
  from {
    opacity: 0;
    transform: translateY(15px) scale(.98);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}
</style>
</head>

<body>

<div class="overlay"></div>

<div id="wrap">

  <div class="brand-header">

    <img src="logo.png"
         alt="Logo"
         onerror="this.style.display='none'">

    <b>ABAS4D</b>

  </div>

  <div class="sub-name">عباس محمود</div>

  <div id="state">running jailbreak...</div>

  <div id="log">Starting exploit...</div>

</div>

<script>
  (function() {
    var logDiv = document.getElementById("log");

    function appendLog(msg, isErr) {
      if (!logDiv) return;

      var line = document.createElement("div");

      if (isErr)
        line.className = "err";

      line.textContent = msg;

      logDiv.appendChild(line);

      logDiv.scrollTop =
        logDiv.scrollHeight;
    }

    var origLog = console.log;

    console.log = function() {
      origLog.apply(console, arguments);

      var args =
        Array.prototype.slice
        .call(arguments)
        .join(" ");

      appendLog(args, false);
    };

    var origErr = console.error;

    console.error = function() {
      origErr.apply(console, arguments);

      var args =
        Array.prototype.slice
        .call(arguments)
        .join(" ");

      appendLog(
        "Error: " + args,
        true
      );
    };

    var OrigWorker = window.Worker;

    window.Worker =
      function(scriptURL, options) {

        appendLog(
          "Launching worker: " +
          scriptURL,
          false
        );

        var w =
          new OrigWorker(
            scriptURL,
            options
          );

        w.onerror = function(e) {

          appendLog(
            "Worker Error (" +
            scriptURL +
            "): " +
            (
              e.message ||
              "Failed to load worker"
            ),
            true
          );
        };

        return w;
      };

    window.addEventListener(
      "unhandledrejection",
      function(e) {

        appendLog(
          "Promise Error: " +
          (
            e.reason
              ? (
                  e.reason.message ||
                  e.reason
                )
              : e
          ),
          true
        );

      }
    );

  })();
</script>

<script type="module" src="jb.js"></script>

</body>
</html>
