<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABAS4D - Jailbreak</title>

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #0a0c10 url('bg.jpg') no-repeat center center fixed;
    background-size: cover;
    color: #e6ebf2;
    font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(10, 12, 16, 0.75);
    z-index: 1;
  }

  #wrap {
    position: relative;
    z-index: 2;

    width: 90%;
    max-width: 460px;

    padding: 30px 24px;
    margin: 20px auto;

    background: rgba(20, 24, 33, 0.88);

    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;

    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    text-align: center;
  }

  .brand-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 8px;
  }

  .brand-header img {
    width: 52px;
    height: 52px;

    border-radius: 50%;
    object-fit: cover;

    border: 2px solid #00ff88;

    box-shadow:
      0 0 12px rgba(0, 255, 136, 0.4);
  }

  .brand-header b {
    margin: 0;

    font-size: 26px;
    font-weight: 800;
    letter-spacing: 2px;

    color: #ffffff;
  }

  .sub-name {
    font-size: 16px;
    color: #8b95a3;

    margin: 0 0 20px;

    font-weight: 600;
  }

  #state {
    font-size: 22px;
    font-weight: 700;

    margin: 10px 0 12px;

    color: #7fd0a0;

    min-height: 32px;
  }

  #log {
    font-size: 13px;

    color: #cbd5e0;

    margin-top: 12px;

    white-space: pre-wrap;
    word-break: break-all;

    background: rgba(0, 0, 0, 0.5);

    padding: 12px;

    border-radius: 10px;

    border: 1px solid rgba(255, 255, 255, 0.08);

    text-align: left;

    max-height: 180px;

    overflow-y: auto;

    box-shadow:
      inset 0 0 15px rgba(0, 0, 0, 0.25);
  }

  .err {
    color: #fc8181;
    font-weight: bold;
  }
</style>
</head>

<body>

<div class="overlay"></div>

<div id="wrap">

  <div class="brand-header">
    <img src="logo.png"
         alt="Logo"
         onerror="this.style.display='none'">

    <b>ABAS4D</b>
  </div>

  <div class="sub-name">عباس محمود</div>

  <div id="state">running jailbreak...</div>

  <div id="log">Starting exploit...</div>

</div>

<script>
  (function() {
    var logDiv = document.getElementById("log");
    function appendLog(msg, isErr) {
      if (!logDiv) return;
      var line = document.createElement("div");
      if (isErr) line.className = "err";
      line.textContent = msg;
      logDiv.appendChild(line);
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    var origLog = console.log;
    console.log = function() {
      origLog.apply(console, arguments);
      var args = Array.prototype.slice.call(arguments).join(" ");
      appendLog(args, false);
    };

    var origErr = console.error;
    console.error = function() {
      origErr.apply(console, arguments);
      var args = Array.prototype.slice.call(arguments).join(" ");
      appendLog("Error: " + args, true);
    };

    // اعتراض أخطاء الـ Worker لتتبع rpc_worker.js
    var OrigWorker = window.Worker;
    window.Worker = function(scriptURL, options) {
      appendLog("Launching worker: " + scriptURL, false);
      var w = new OrigWorker(scriptURL, options);
      w.onerror = function(e) {
        appendLog(
          "Worker Error (" +
          scriptURL +
          "): " +
          (e.message || "Failed to load worker"),
          true
        );
      };
      return w;
    };

    window.addEventListener("unhandledrejection", function(e) {
      appendLog(
        "Promise Error: " +
        (e.reason
          ? (e.reason.message || e.reason)
          : e),
        true
      );
    });
  })();
</script>

<script type="module" src="jb.js"></script>

</body>
</html>
