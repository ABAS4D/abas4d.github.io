    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>RAW GAME - Lord Fordi Host</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #07090e 0%, #0c121d 100%);
        color: #e2e8f0;
        font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
      }
      #brand {
        text-align: center;
        padding: 15px 10px;
        background: rgba(15, 23, 42, 0.9);
        border-bottom: 1px solid rgba(56, 189, 248, 0.2);
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        z-index: 10;
      }
      #brand img {
        width: 30px;
        height: 30px;
        border-radius: 50%;
      }
      #brand b {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: #f8fafc;
      }
      
      /* Main Container for Status & Logs */
      #main-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        position: relative;
      }

      #spin {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(56, 189, 248, 0.1);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        margin-bottom: 20px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      #msg {
        font-size: 20px;
        color: #fbbf24;
        font-weight: 600;
        text-align: center;
        margin-bottom: 15px;
        text-shadow: 0 0 10px rgba(251,191,36,0.3);
      }

      #wrap {
        width: 100%;
        max-width: 650px;
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(56, 189, 248, 0.2);
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      }

      #state {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 12px;
        color: #38bdf8;
      }

      #out {
        white-space: pre-wrap;
        font: 13px/1.45 Consolas, monospace;
        background: rgba(7, 9, 14, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 8px;
        padding: 12px;
        height: 220px;
        overflow-y: auto;
        color: #cbd5e1;
        text-align: left;
      }

      .footer-credit {
        text-align: center;
        padding: 15px;
        font-size: 13px;
        color: #64748b;
        letter-spacing: 0.5px;
        background: rgba(7, 9, 14, 0.4);
        border-top: 1px solid rgba(255,255,255,0.03);
      }
      .footer-credit span {
        color: #38bdf8;
        font-weight: 600;
      }

      body.done #spin { display: none; }
      body.done #msg { color: #34d399; }
      body.fail #spin { display: none; }
      body.fail #msg { color: #f87171; }

      .ok { color: #34d399; }
      .bad { color: #f87171; }
      .warn { color: #fbbf24; }
      code { color: #38bdf8; }
    </style>
  </head>
