<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABAS4D - عباس محمود</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;

    font-family:
        Arial,
        "Segoe UI",
        sans-serif;

    color: #ffffff;

    background:
        #080b0f
        url("bg.jpg")
        no-repeat
        center
        center
        fixed;

    background-size: cover;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

.overlay {
    position: fixed;
    left: 0;
    top: 0;
    right: 0;
    bottom: 0;

    background: rgba(0, 0, 0, 0.38);

    z-index: 1;
}

#wrap {
    position: relative;
    z-index: 2;

    width: 90%;
    max-width: 460px;

    padding: 30px 24px;

    text-align: center;

    background: rgba(10, 15, 20, 0.62);

    border: 1px solid rgba(255, 255, 255, 0.18);

    border-radius: 18px;

    box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.65),
        0 0 20px rgba(0, 255, 136, 0.08);
}

#wrap:before {
    content: "";

    position: absolute;

    top: 0;
    left: 15%;

    width: 70%;
    height: 2px;

    background: #00ff88;

    opacity: 0.75;
}

.brand-header {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 13px;

    margin-bottom: 8px;
}

.brand-header img {
    width: 55px;
    height: 55px;

    border-radius: 50%;

    object-fit: cover;

    border: 2px solid #00ff88;

    box-shadow:
        0 0 15px rgba(0, 255, 136, 0.35);
}

.brand-header b {
    font-size: 27px;

    font-weight: bold;

    letter-spacing: 2px;

    color: #ffffff;
}

.sub-name {
    margin: 0 0 22px;

    font-size: 17px;

    font-weight: bold;

    color: #d2d8df;
}

#state {
    min-height: 32px;

    margin: 10px 0;

    font-size: 21px;

    font-weight: bold;

    color: #7fd0a0;
}

#log {
    margin-top: 14px;

    padding: 13px;

    max-height: 190px;

    overflow-y: auto;

    text-align: left;

    font-size: 13px;

    line-height: 1.5;

    color: #d4dbe3;

    background: rgba(0, 0, 0, 0.38);

    border:
        1px solid
        rgba(255, 255, 255, 0.10);

    border-radius: 10px;

    white-space: pre-wrap;

    word-break: break-all;
}

.err {
    color: #fc8181;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="overlay"></div>

<div id="wrap">

    <div class="brand-header">

        <img
            src="logo.png"
            alt="Logo"
            onerror="this.style.display='none'"
        >

        <b>ABAS4D</b>

    </div>

    <div class="sub-name">
        عباس محمود
    </div>

    <div id="state">
        running jailbreak...
    </div>

    <div id="log">
        Starting exploit...
    </div>

</div>

<script>
(function() {
    var logDiv = document.getElementById("log");

    function appendLog(msg, isErr) {
        if (!logDiv) return;

        var line = document.createElement("div");

        if (isErr)
            line.className = "err";

        line.textContent = msg;

        logDiv.appendChild(line);

        logDiv.scrollTop =
            logDiv.scrollHeight;
    }

    var origLog = console.log;

    console.log = function() {
        origLog.apply(console, arguments);

        var args =
            Array.prototype.slice
            .call(arguments)
            .join(" ");

        appendLog(args, false);
    };

    var origErr = console.error;

    console.error = function() {
        origErr.apply(console, arguments);

        var args =
            Array.prototype.slice
            .call(arguments)
            .join(" ");

        appendLog(
            "Error: " + args,
            true
        );
    };

    var OrigWorker = window.Worker;

    window.Worker = function(scriptURL, options) {

        appendLog(
            "Launching worker: " +
            scriptURL,
            false
        );

        var w =
            new OrigWorker(
                scriptURL,
                options
            );

        w.onerror = function(e) {

            appendLog(
                "Worker Error (" +
                scriptURL +
                "): " +
                (
                    e.message ||
                    "Failed to load worker"
                ),
                true
            );
        };

        return w;
    };

    window.addEventListener(
        "unhandledrejection",
        function(e) {

            appendLog(
                "Promise Error: " +
                (
                    e.reason
                    ? (
                        e.reason.message ||
                        e.reason
                    )
                    : e
                ),
                true
            );

        }
    );

})();
</script>

<script type="module" src="jb.js"></script>

</body>
</html>
