<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABAS4D - Jailbreak</title>

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #0a0c10 url('bg.jpg') no-repeat center center fixed;
    background-size: cover;
    color: #e6ebf2;
    font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 12, 16, 0.75);
    z-index: 1;
  }

  #wrap {
    position: relative;
    z-index: 2;
    width: 90%;
    max-width: 460px;
    padding: 30px 24px;
    margin: 20px auto;
    background: rgba(20, 24, 33, 0.94);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    text-align: center;
  }

  .brand-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 24px;
  }

  .brand-header img {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #00ff88;
    box-shadow: 0 0 12px rgba(0, 255, 136, 0.4);
  }

  .brand-header b {
    margin: 0;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #ffffff;
  }

  .sub-name {
    font-size: 16px;
    color: #8b95a3;
    margin: 0 0 24px;
    font-weight: 600;
  }

  #msg {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #ffffff;
    margin: 10px 0;
    min-height: 38px;
  }

  body.done #msg {
    color: #39e879;
  }

  body.fail #msg {
    color: #ff3b3b;
  }

  #state {
    display: none;
  }

  #log,
  #out {
    display: none;
  }
</style>
</head>

<body>

<div class="overlay"></div>

<div id="wrap">

  <div class="brand-header">
    <img src="logo.png"
         alt="Logo"
         onerror="this.style.display='none'">

    <b>ABAS4D</b>
  </div>

  <div class="sub-name">عباس محمود</div>

  <div id="msg">RUNNING</div>

  <div id="state"></div>
  <div id="log"></div>
  <div id="out"></div>

</div>

<script>
  (function() {
    var logDiv = document.getElementById("log");

    function appendLog(msg, isErr) {
      if (!logDiv) return;
      var line = document.createElement("div");
      if (isErr) line.className = "err";
      line.textContent = msg;
      logDiv.appendChild(line);
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    /*
     * Keep the existing exploit/program flow untouched.
     * Logs are collected only when the existing jb.js requests them.
     * The normal UI stays clean.
     */
    var origLog = console.log;
    console.log = function() {
      origLog.apply(console, arguments);
    };

    var origErr = console.error;
    console.error = function() {
      origErr.apply(console, arguments);
    };
  })();
</script>

<script type="module" src="jb.js"></script>

</body>
</html>
