<!DOCTYPE html>

<title>ABAS4D - Jailbreak</title>
<style>
  * { box-sizing: border-box; }
  body { 
    margin: 0; 
    padding: 0; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b0d10 url('bg.jpg') no-repeat center center fixed;
    background-size: cover;
    color: #c8ced8;
    min-height: 100vh;

  }
  .brand-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 15px;
  }
  .brand-header img {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #7fd0a0;
  }
  .brand-header b {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #ffffff;
  }
  #state { font-size: 20px; font-weight: 700; margin: 10px 0; color: #7fd0a0; }
  #log { font-size: 13px; color: #8b95a3; margin: 0 0 4px; white-space: pre-wrap; word-break: break-all; }
