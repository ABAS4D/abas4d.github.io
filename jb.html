<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">

<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>ABAS4D</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
}

body {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        #090b10 url("bg.jpg")
        center center / cover no-repeat;

    color: #fff;

    font-family:
        Arial,
        Tahoma,
        sans-serif;

    touch-action: none;
    overscroll-behavior: none;
}

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(5,7,12,.78);
}

.box {
    position: fixed;

    left: 50%;
    top: 50%;

    width: 90%;
    max-width: 460px;

    transform: translate(-50%, -50%);

    padding: 30px 25px;

    background: rgba(19,23,32,.96);

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius: 18px;

    text-align: center;

    box-shadow:
        0 15px 45px
        rgba(0,0,0,.65);

    z-index: 2;
}

.logo {
    width: 65px;
    height: 65px;

    object-fit: cover;

    border-radius: 50%;

    margin-bottom: 10px;
}

.title {
    font-size: 28px;
    font-weight: 800;

    margin-bottom: 20px;
}

#status {
    font-size: 22px;
    font-weight: 800;

    min-height: 32px;
}

#info {
    margin-top: 12px;

    color: #9ba3af;

    font-size: 14px;

    line-height: 1.7;
}

.ok {
    color: #39e879;
}

.warn {
    color: #ffd43b;
}

.bad {
    color: #ff5252;
}

.spinner {
    width: 32px;
    height: 32px;

    margin: 20px auto;

    border:
        4px solid
        rgba(255,255,255,.18);

    border-top-color: #fff;
    border-right-color: #fff;

    border-radius: 50%;

    animation:
        spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

#start {
    width: 100%;

    margin-top: 22px;

    padding: 15px;

    border: 0;

    border-radius: 10px;

    background: #00c875;

    color: #07120d;

    font-size: 20px;
    font-weight: 800;
}

#start:disabled {
    opacity: .45;
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="box">

    <img
        src="logo.png"
        class="logo"
        alt="ABAS4D"
        onerror="this.style.display='none'"
    >

    <div class="title">
        ABAS4D
    </div>

    <div id="status">
        جاري التحميل...
    </div>

    <div class="spinner"
         id="spinner">
    </div>

    <div id="info">
        جاري تجهيز الصفحة...
    </div>

    <button
        id="start"
        disabled>
        اضغط X للبدء
    </button>

</div>


<script>
(function () {

"use strict";

var status =
    document.getElementById("status");

var info =
    document.getElementById("info");

var spinner =
    document.getElementById("spinner");

var start =
    document.getElementById("start");


/*
 * ننتظر قليلاً حتى يكمل المتصفح
 * تحميل الصفحة من الكاش.
 *
 * لا يوجد هنا fetch ولا طلب إنترنت.
 */

setTimeout(function () {

    spinner.style.display = "none";

    status.textContent =
        "جاهز";

    status.className =
        "ok";

    info.innerHTML =
        "تم تجهيز الصفحة.<br>" +
        "يمكنك فصل الإنترنت الآن.";

    start.disabled = false;

}, 2500);


/*
 * زر X / Enter
 *
 * تشغيل الصفحة التالية فقط بعد
 * تأكيد المستخدم.
 */

function openHost() {

    if (start.disabled)
        return;

    start.disabled = true;

    status.textContent =
        "جاري التشغيل...";

    status.className =
        "warn";

    info.textContent =
        "جاري فتح صفحة التشغيل...";

    /*
     * لا نضيف Date.now()
     * حتى يبقى الرابط قابلاً
     * للاستخدام من الكاش.
     */

    setTimeout(function () {

        location.href = "jb.html";

    }, 400);

}


start.addEventListener(
    "click",
    openHost
);


/*
 * Enter / X حسب طريقة
 * إرسال المتصفح للزر.
 */

document.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Enter" ||
            event.key === " "
        ) {

            if (!start.disabled) {
                openHost();
            }

        }

    }
);


/*
 * منع تحريك الصفحة بسبب drift.
 */

document.addEventListener(
    "touchmove",
    function (event) {
        event.preventDefault();
    },
    {
        passive: false
    }
);

})();
</script>

</body>
</html>
