<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAW GAME - Lord Fordi Host</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #07090e 0%, #0c121d 100%);
    color: #e2e8f0;
    font: 16px/1.6 "Cairo", "Segoe UI", system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  
  #brand {
    position: absolute;
    top: 30px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(15, 23, 42, 0.85);
    padding: 10px 22px;
    border-radius: 35px;
    border: 1px solid rgba(56, 189, 248, 0.2);
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }
  #brand img {
    width: 32px;
    height: 32px;
    border-radius: 50%;
  }
  #brand b {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: #f8fafc;
  }

  #wrap {
    text-align: center;
    padding: 35px 25px;
    background: rgba(15, 23, 42, 0.75);
    border: 1px solid rgba(56, 189, 248, 0.25);
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    max-width: 480px;
    width: 90%;
  }

  #state {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 15px;
    color: #38bdf8;
    text-shadow: 0 0 10px rgba(56,189,248,0.3);
  }

  #cache {
    font-size: 15px;
    color: #94a3b8;
    margin: 0 0 20px;
    font-weight: 500;
  }

  /* شريط التحميل */
  #progress-bar-container {
    width: 100%;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    height: 12px;
    overflow: hidden;
    margin-top: 15px;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }
  #progress-bar {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #38bdf8, #34d399);
    transition: width 0.3s ease;
    border-radius: 10px;
  }

  #percentage {
    margin-top: 10px;
    font-size: 14px;
    font-weight: bold;
    color: #34d399;
  }

  .footer-credit {
    position: absolute;
    bottom: 25px;
    font-size: 14px;
    color: #64748b;
    letter-spacing: 0.5px;
    text-align: center;
  }
  .footer-credit span {
    color: #38bdf8;
    font-weight: 700;
  }
</style>
</head>
