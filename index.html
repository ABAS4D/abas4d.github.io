<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ABAS4D HOST</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000 url("bg.jpg") center/cover no-repeat;
    font-family:Arial,Tahoma,sans-serif;
    color:#fff;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
}

.card{
    position:relative;
    z-index:2;
    width:90%;
    max-width:450px;
    padding:30px 20px;
    text-align:center;
    background:rgba(15,15,15,.94);
    border:1px solid rgba(255,255,255,.15);
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.7);
}

.logo{
    width:70px;
    height:70px;
    object-fit:cover;
    border-radius:50%;
    margin-bottom:12px;
}

.title{
    font-size:27px;
    font-weight:bold;
    letter-spacing:2px;
}

#state{
    margin-top:18px;
    font-size:20px;
    font-weight:bold;
}

#det{
    margin-top:8px;
    color:#aaa;
    font-size:13px;
}

#cache{
    margin-top:15px;
    color:#ffd400;
    font-weight:bold;
    font-size:16px;
}

.footer{
    margin-top:22px;
    padding-top:12px;
    border-top:1px solid rgba(255,255,255,.1);
    color:#777;
    font-size:12px;
}

.green{color:#39e879!important}
.red{color:#ff4444!important}
.yellow{color:#ffd400!important}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="card">

    <img src="logo.png" class="logo" onerror="this.style.display='none'">

    <div class="title">ABAS4D</div>

    <div id="state">جاري التحقق...</div>

    <div id="det"></div>

    <div id="cache"></div>

    <div class="footer">
        © 2026 ABAS4D — عباس محمود
    </div>

</div>

<script>
(function(){

    const state = document.getElementById("state");
    const det = document.getElementById("det");
    const cache = document.getElementById("cache");

    const SUPPORTED = {
        1302:true,
        1304:true,
        1350:true,
        1352:true
    };

    let key = null;
    let fw = null;

    const m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(
        navigator.userAgent
    );

    if(m){

        let minor = parseInt(m[2],16).toString(16);

        if(minor.length < 2)
            minor = "0" + minor;

        key = m[1] + "." + minor;

        fw =
            parseInt(m[1],10) * 100 +
            parseInt(minor,10);
    }

    det.innerHTML =
        "النظام: <b>" +
        (key || "غير معروف") +
        "</b>";

    function run(){

        state.textContent =
            "جاري تشغيل الجلبريك...";

        state.className = "yellow";

        location.replace(
            "jb.html" + location.search
        );
    }

    if(
        fw !== null &&
        SUPPORTED[fw]
    ){

        if(!window.applicationCache){

            cache.textContent =
                "جاهز";

            cache.className =
                "green";

            run();

            return;
        }

        const ac =
            window.applicationCache;

        if(
            ac.status ===
            window.applicationCache.IDLE
        ){

            cache.textContent =
                "جاهز";

            cache.className =
                "green";

            run();

            return;
        }

        cache.textContent =
            "جاري التخزين المؤقت...";

        ac.addEventListener(
            "cached",
            function(){

                cache.textContent =
                    "اكتمل التخزين المؤقت";

                cache.className =
                    "green";

                setTimeout(run,300);
            },
            false
        );

        ac.addEventListener(
            "noupdate",
            function(){

                cache.textContent =
                    "جاهز";

                cache.className =
                    "green";

                setTimeout(run,300);
            },
            false
        );

        ac.addEventListener(
            "updateready",
            function(){

                try{
                    ac.swapCache();
                }catch(e){}

                cache.textContent =
                    "اكتمل التحديث";

                cache.className =
                    "green";

                setTimeout(
                    function(){
                        location.reload();
                    },
                    300
                );
            },
            false
        );

        ac.addEventListener(
            "error",
            function(){

                cache.textContent =
                    "خطأ بالتخزين المؤقت";

                cache.className =
                    "red";

                setTimeout(run,500);
            },
            false
        );

    }else{

        state.textContent =
            "النظام غير مدعوم";

        state.className =
            "red";

        cache.textContent =
            "اخرج، أطفئ الإنترنت، وعُد ثم اضغط X أو المس الشاشة";

        cache.className =
            "yellow";

        document.addEventListener(
            "keydown",
            function(e){

                if(e.key === "Enter" ||
                   e.key === "x" ||
                   e.key === "X"){

                    run();
                }

            }
        );

        document.addEventListener(
            "click",
            run,
            {once:true}
        );
    }

})();
</script>

</body>
</html>
