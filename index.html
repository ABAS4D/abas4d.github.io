<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">

<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>ABAS4D HOST</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 padding:0;
 width:100%;
 min-height:100%;
 background:#0a0c10 url("bg.jpg")
 center/cover fixed no-repeat;
 color:#eee;
 font-family:Arial,Tahoma,sans-serif
}

body{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center
}

.box{
 width:90%;
 max-width:450px;
 padding:30px 24px;
 text-align:center;
 background:rgba(20,24,33,.95);
 border-radius:16px;
 border:1px solid rgba(255,255,255,.15)
}

.logo{
 width:60px;
 height:60px;
 border-radius:50%;
 margin-bottom:12px
}

h1{
 margin:5px 0 20px;
 font-size:28px
}

#msg{
 font-size:22px;
 font-weight:bold;
 margin:15px 0
}

#fw{
 color:#999;
 margin-bottom:20px
}

button{
 width:100%;
 padding:15px;
 border:0;
 border-radius:10px;
 background:#00c875;
 font-size:20px;
 font-weight:bold
}

.bad{color:#ff5555}
.ok{color:#39e879}
</style>
</head>

<body>

<div class="box">

<img
 src="logo.png"
 class="logo"
 onerror="this.style.display='none'">

<h1>ABAS4D</h1>

<div id="fw">
جاري التحقق...
</div>

<div id="msg">
انتظر...
</div>

<button id="go" style="display:none">
اضغط X للدخول
</button>

</div>

<script>

(function(){

const fwEl =
document.getElementById("fw");

const msg =
document.getElementById("msg");

const go =
document.getElementById("go");

const m =
/PlayStation\s+4[\/ ](\d+)\.(\d+)/
.exec(navigator.userAgent);

if(!m){

 fwEl.textContent =
 "Firmware غير معروف";

 msg.textContent =
 "لم يتم التشغيل";

 msg.className="bad";

 return;
}

const major =
parseInt(m[1],10);

const minor =
parseInt(m[2],16);

const key =
major+"."+
(minor<16
 ? ("0"+minor.toString(16)).slice(-2)
 : minor.toString(16));

const num =
major*100+minor;

const supported =
{
 1302:true,
 1304:true,
 1350:true,
 1352:true
};

fwEl.textContent =
"Firmware: "+key;

if(!supported[num]){

 msg.textContent =
 "الإصدار غير مدعوم";

 msg.className="bad";

 return;
}

msg.textContent =
 "جاهز";

msg.className="ok";

go.style.display="block";

function openHost(){

 go.disabled=true;

 location.href =
 "jb.html";

}

go.addEventListener(
 "click",
 openHost
);

document.addEventListener(
 "keydown",
 function(e){

  if(
   e.key==="Enter" ||
   e.key===" "
  ){
   openHost();
  }

 }
);

})();

</script>

</body>
</html>
