<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>عباس محمود - ABAS4D</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #05070a url('bg.jpg') no-repeat center center fixed;
  background-size: cover;
  color: #e6ebf2;
  font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.overlay {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 50% 35%, rgba(0,255,136,0.08), transparent 35%),
    rgba(3,5,8,0.78);
  z-index: 1;
}

.card {
  position: relative;
  z-index: 2;
  width: 90%;
  max-width: 470px;
  padding: 34px 26px 26px;

  background: linear-gradient(
    145deg,
    rgba(24,30,40,0.94),
    rgba(10,14,20,0.91)
  );

  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 22px;

  text-align: center;

  box-shadow:
    0 25px 70px rgba(0,0,0,0.75),
    0 0 35px rgba(0,255,136,0.06);

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  animation: cardIn .7s ease;
}

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 12%;
  width: 76%;
  height: 1px;
  background: linear-gradient(
    90deg,
    transparent,
    #00ff88,
    transparent
  );
  opacity: .8;
}

.brand-header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
  margin-bottom: 7px;
}

.brand-header img {
  width: 58px;
  height: 58px;

  border-radius: 50%;
  object-fit: cover;

  border: 2px solid #00ff88;

  box-shadow:
    0 0 0 4px rgba(0,255,136,0.06),
    0 0 22px rgba(0,255,136,0.35);
}

.brand-header h1 {
  margin: 0;

  font-size: 29px;
  font-weight: 900;
  letter-spacing: 3px;

  color: #fff;

  text-shadow:
    0 0 18px rgba(255,255,255,0.12);
}

.sub-name {
  margin: 0 0 24px;

  font-size: 17px;
  font-weight: 700;

  color: #9ca8b8;

  letter-spacing: 1px;
}

#state {
  font-size: 21px;
  font-weight: 800;

  margin: 12px 0 12px;

  min-height: 32px;

  color: #7fd0a0;

  text-shadow:
    0 0 14px rgba(127,208,160,0.18);
}

#det {
  font-size: 13px;
  color: #7f8a99;
  margin: 0 0 10px;
}

#det b {
  color: #dce4ed;
  font-weight: 700;
}

#cache {
  min-height: 18px;

  font-size: 12px;
  color: #687384;

  margin-top: 10px;

  letter-spacing: .3px;
}

#cache.cacheok {
  color: #7fd0a0;
}

.ok {
  color: #7fd0a0;
}

.bad {
  color: #fc8181;
}

.warn {
  color: #f6ad55;
}

.copyright {
  margin-top: 25px;
  padding-top: 16px;

  border-top: 1px solid rgba(255,255,255,0.08);

  font-size: 12px;
  color: #697586;

  letter-spacing: 1px;
}

.copyright b {
  color: #00ff88;
  font-weight: 800;
}

@keyframes cardIn {
  from {
    opacity: 0;
    transform: translateY(15px) scale(.98);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="card">

  <div class="brand-header">
    <img src="logo.png"
         alt="Logo"
         onerror="this.style.display='none'">

    <h1>ABAS4D</h1>
  </div>

  <div class="sub-name">عباس محمود</div>

  <div id="state">detecting firmware...</div>

  <div id="det"></div>

  <div id="cache"></div>

  <div class="copyright">
    © 2026 <b>عباس محمود</b> — ABAS4D
  </div>

</div>

<script>
(function () {

    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");

    function setState(t, c) {
        stateEl.textContent = t;
        stateEl.className = c || "";
    }

    function setCache(t, ok) {
        cacheEl.textContent = t;
        cacheEl.className = ok ? "cacheok" : "";
    }

    var params = new URLSearchParams(location.search);

    var SUPPORTED = {
        1302: 1,
        1304: 1,
        1350: 1,
        1352: 1
    };

    var key = null, fwnum = null;

    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(
        navigator.userAgent
    );

    if (m) {

        var ms = parseInt(m[2], 16).toString(16);

        if (ms.length < 2)
            ms = "0" + ms;

        key = m[1] + "." + ms;

        fwnum =
            parseInt(m[1], 10) * 100 +
            parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";

    var supported =
        forced ||
        (fwnum !== null && SUPPORTED[fwnum] === 1);

    detEl.innerHTML =
        "firmware <b>" +
        (key || "unknown") +
        "</b>" +
        (supported
            ? " &middot; <b>supported</b>"
            : " &middot; not in this build's kernel table");

    var target = "jb.html" + location.search;

    function go() {
        setState("loading jailbreak...", "warn");
        location.replace(target);
    }

    function waitForTap(msg, action) {

        setState(msg, "warn");

        function fire() {

            window.removeEventListener(
                "click",
                fire
            );

            window.removeEventListener(
                "keydown",
                fire
            );

            action();
        }

        window.addEventListener(
            "click",
            fire
        );

        window.addEventListener(
            "keydown",
            fire
        );
    }

    if (!supported) {

        setState(
            "UNSUPPORTED FIRMWARE",
            "bad"
        );

        waitForTap(
            "UNSUPPORTED (" +
            (key || "unknown") +
            ") -- press X or tap to run anyway",
            go
        );

        return;
    }

    var ac = window.applicationCache;

    if (
        !ac ||
        !document.documentElement.hasAttribute("manifest")
    ) {

        go();

    } else if (!navigator.onLine) {

        setCache(
            "offline -- from cache",
            true
        );

        go();

    } else if (ac.status === ac.IDLE) {

        setCache(
            "cached",
            true
        );

        go();

    } else if (ac.status === ac.UPDATEREADY) {

        try {
            ac.swapCache();
        } catch (e) {}

        setCache(
            "update downloaded",
            true
        );

        waitForTap(
            "UPDATE READY -- press X or tap to reload & run",
            function () {
                location.reload();
            }
        );

    } else {

        setCache(
            "checking cache..."
        );

        ac.addEventListener(
            "downloading",
            function () {
                setCache(
                    "caching for offline (first run)..."
                );
            },
            false
        );

        ac.addEventListener(
            "progress",
            function (e) {

                if (e && e.total) {

                    setCache(
                        "caching " +
                        Math.round(
                            (e.loaded / e.total) * 100
                        ) +
                        "%"
                    );
                }

            },
            false
        );

        ac.addEventListener(
            "cached",
            function () {

                setCache(
                    "cached for offline use",
                    true
                );

                waitForTap(
                    "CACHED (first run) -- press X or tap to run",
                    go
                );

            },
            false
        );

        ac.addEventListener(
            "updateready",
            function () {

                try {
                    ac.swapCache();
                } catch (e) {}

                setCache(
                    "update downloaded",
                    true
                );

                waitForTap(
                    "UPDATE READY -- press X or tap to reload & run",
                    function () {
                        location.reload();
                    }
                );

            },
            false
        );

        ac.addEventListener(
            "noupdate",
            function () {

                setCache(
                    "cached -- offline ready",
                    true
                );

                go();

            },
            false
        );

        ac.addEventListener(
            "error",
            function () {

                setCache(
                    "cache unavailable"
                );

                waitForTap(
                    "CACHE FAILED -- press X or tap to run anyway",
                    go
                );

            },
            false
        );

        ac.addEventListener(
            "obsolete",
            function () {

                setCache(
                    "cache obsolete"
                );

                waitForTap(
                    "CACHE OBSOLETE -- press X or tap to run",
                    go
                );

            },
            false
        );
    }

})();
</script>

</body>
</html>
