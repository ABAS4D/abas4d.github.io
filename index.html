<!DOCTYPE html>
<html lang="ar" dir="rtl"
      manifest="cache.appcache">

<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>ABAS4D</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
}

body {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        #090b10 url("bg.jpg")
        center center / cover no-repeat;

    color: #ffffff;

    font-family:
        Arial,
        Tahoma,
        sans-serif;

    touch-action: none;
    overscroll-behavior: none;
}

.overlay {
    position: fixed;
    inset: 0;

    background:
        rgba(5,7,12,.78);

    pointer-events: none;
}

.card {
    position: fixed;

    left: 50%;
    top: 50%;

    width: 90%;
    max-width: 460px;

    transform:
        translate(-50%, -50%);

    padding: 30px 25px;

    background:
        rgba(19,23,32,.96);

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius: 18px;

    text-align: center;

    box-shadow:
        0 15px 45px
        rgba(0,0,0,.65);

    z-index: 2;
}

.brand-header {

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 12px;

    margin-bottom: 22px;
}

.brand-header img {

    width: 58px;
    height: 58px;

    object-fit: cover;

    border-radius: 50%;

    border:
        2px solid
        #00ff88;
}

.brand-header h1 {

    margin: 0;

    font-size: 28px;

    font-weight: 800;

    letter-spacing: 1px;
}

#state {

    font-size: 23px;

    font-weight: 800;

    min-height: 34px;

    margin-top: 10px;
}

#det {

    margin-top: 12px;

    color: #9ba3af;

    font-size: 14px;

    line-height: 1.7;
}

#cache {

    margin-top: 15px;

    color: #9ba3af;

    font-size: 14px;

    line-height: 1.7;
}

.cacheok {
    color: #39e879 !important;
}

.warn {
    color: #ffd43b;
}

.bad {
    color: #ff5252;
}

.copyright {

    margin-top: 25px;

    color: #777f8c;

    font-size: 13px;
}

.copyright b {

    color: #00ff88;
}

</style>

</head>


<body>

<div class="overlay"></div>


<div class="card">

    <div class="brand-header">

        <img
            src="logo.png"
            alt="Logo"
            onerror="
                this.style.display='none'
            "
        >

        <h1>
            ABAS4D
        </h1>

    </div>


    <div id="state">
        detecting firmware...
    </div>


    <div id="det"></div>


    <div id="cache"></div>


    <div class="copyright">

        © 2026
        <b>ABAS4D</b>
        — عباس محمود

    </div>

</div>


<script>

(function () {

    var stateEl =
        document.getElementById(
            "state"
        );

    var detEl =
        document.getElementById(
            "det"
        );

    var cacheEl =
        document.getElementById(
            "cache"
        );


    function setState(
        text,
        className
    ) {

        stateEl.textContent =
            text;

        stateEl.className =
            className || "";

    }


    function setCache(
        text,
        ok
    ) {

        cacheEl.textContent =
            text;

        cacheEl.className =
            ok
                ? "cacheok"
                : "";

    }


    var params =
        new URLSearchParams(
            location.search
        );


    /*
     * الإصدارات المدعومة
     */

    var SUPPORTED = {

        1302: 1,
        1304: 1,
        1350: 1,
        1352: 1

    };


    var key = null;

    var fwnum = null;


    /*
     * قراءة Firmware من PS4
     */

    var m =
        /PlayStation\s+4[\/ ](\d+)\.(\d+)/
        .exec(
            navigator.userAgent
        );


    if (m) {

        var ms =
            parseInt(
                m[2],
                16
            ).toString(16);


        if (ms.length < 2) {

            ms =
                "0" + ms;

        }


        key =
            m[1] +
            "." +
            ms;


        fwnum =
            parseInt(
                m[1],
                10
            ) * 100 +

            parseInt(
                ms,
                10
            );

    }


    /*
     * force=1 يسمح بالدخول
     * حتى لو لم يتعرف على Firmware.
     */

    var forced =
        params.get(
            "force"
        ) === "1";


    var supported =
        forced ||

        (
            fwnum !== null &&
            SUPPORTED[fwnum] === 1
        );


    detEl.innerHTML =

        "firmware <b>" +

        (
            key ||
            "unknown"
        ) +

        "</b>" +

        (
            supported

                ? " &middot; <b>supported</b>"

                : " &middot; not in this build's kernel table"
        );


    /*
     * صفحة التشغيل
     */

    var target =
        "jb.html" +
        location.search;


    function go() {

        setState(
            "RUNNING",
            "warn"
        );

        location.replace(
            target
        );

    }


    /*
     * انتظار ضغطة المستخدم
     */

    function waitForTap(
        msg,
        action
    ) {

        setState(
            msg,
            "warn"
        );


        function fire() {

            window.removeEventListener(
                "click",
                fire
            );

            window.removeEventListener(
                "keydown",
                fire
            );


            action();

        }


        window.addEventListener(
            "click",
            fire
        );


        window.addEventListener(
            "keydown",
            fire
        );

    }


    /*
     * Firmware غير مدعوم
     */

    if (!supported) {

        setState(
            "UNSUPPORTED FIRMWARE",
            "bad"
        );


        waitForTap(
            "اخرج، اطفئ الإنترنت وعُد",
            go
        );


        return;

    }


    /*
     * AppCache
     *
     * هذا الجزء أبقيته على
     * منطق النسخة القديمة.
     */

    var ac =
        window.applicationCache;


    if (

        !ac ||

        !document.documentElement
            .hasAttribute(
                "manifest"
            )

    ) {

        go();


    } else if (
        !navigator.onLine
    ) {

        setCache(
            "OFFLINE — FROM CACHE",
            true
        );


        go();


    } else if (
        ac.status === ac.IDLE
    ) {

        setCache(
            "CACHED",
            true
        );


        go();


    } else if (
        ac.status === ac.UPDATEREADY
    ) {

        try {

            ac.swapCache();

        } catch (e) {}


        setCache(
            "UPDATE DOWNLOADED",
            true
        );


        waitForTap(
            "اخرج، اطفئ الإنترنت وعُد",
            function () {

                location.reload();

            }
        );


    } else {

        /*
         * الكاش قيد التحميل
         */

        setCache(
            "CACHING..."
        );


        ac.addEventListener(

            "downloading",

            function () {

                setCache(
                    "CACHING..."
                );

            },

            false
        );


        ac.addEventListener(

            "progress",

            function (e) {

                if (
                    e &&
                    e.total
                ) {

                    setCache(

                        "CACHING " +

                        Math.round(
                            (
                                e.loaded /
                                e.total
                            ) * 100
                        ) +

                        "%"

                    );

                }

            },

            false
        );


        /*
         * اكتمل التخزين
         */

        ac.addEventListener(

            "cached",

            function () {

                setCache(
                    "CACHED FOR OFFLINE USE",
                    true
                );


                waitForTap(

                    "اخرج، اطفئ الإنترنت وعُد",

                    go

                );

            },

            false
        );


        /*
         * تحديث جديد اكتمل
         */

        ac.addEventListener(

            "updateready",

            function () {

                try {

                    ac.swapCache();

                } catch (e) {}


                setCache(

                    "UPDATE DOWNLOADED",

                    true

                );


                waitForTap(

                    "اخرج، اطفئ الإنترنت وعُد",

                    function () {

                        location.reload();

                    }

                );

            },

            false
        );


        /*
         * ماكو تحديث
         */

        ac.addEventListener(

            "noupdate",

            function () {

                setCache(

                    "CACHED — OFFLINE READY",

                    true

                );


                go();

            },

            false
        );


        /*
         * خطأ بالكاش
         */

        ac.addEventListener(

            "error",

            function () {

                setCache(
                    "CACHE UNAVAILABLE"
                );


                waitForTap(

                    "اخرج، اطفئ الإنترنت وعُد",

                    go

                );

            },

            false
        );


        /*
         * الكاش صار obsolete
         */

        ac.addEventListener(

            "obsolete",

            function () {

                setCache(
                    "CACHE OBSOLETE"
                );


                waitForTap(

                    "اخرج، اطفئ الإنترنت وعُد",

                    go

                );

            },

            false
        );

    }

})();

</script>

</body>

</html>
