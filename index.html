<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABAS4D HOST</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0a0c10 url('bg.jpg') no-repeat center center fixed;
    background-size: cover;
    color: #e6ebf2;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10, 12, 16, 0.75);
    z-index: 1;
  }
  .card {
    position: relative;
    z-index: 2;
    width: 90%;
    max-width: 450px;
    background: rgba(20, 24, 33, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 16px;
    padding: 30px 24px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(8px);
  }
  .brand-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  .brand-header img {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 0 12px rgba(0, 255, 136, 0.3);
  }
  .brand-header h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #ffffff;
  }
  .fw-info {
    font-size: 13px;
    color: #a0aec0;
    margin-bottom: 22px;
    background: rgba(255, 255, 255, 0.06);
    padding: 8px 14px;
    border-radius: 20px;
    display: inline-block;
  }
  .status-box {
    margin-top: 10px;
    font-size: 18px;
    font-weight: 600;
    color: #cbd5e0;
    min-height: 32px;
  }
  .done {
    color: #00ff88 !important;
    font-size: 32px !important;
    font-weight: 900 !important;
    letter-spacing: 3px;
    text-shadow: 0 0 15px rgba(0, 255, 136, 0.6);
  }
  .warn { color: #f6ad55; }
  .bad { color: #fc8181; }
  .sub-status {
    font-size: 12px;
    color: #718096;
    margin-top: 10px;
  }
</style>
</head>
<body>
<div class="overlay"></div>
<div class="card">
  <div class="brand-header">
    <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
    <h1>ABAS4D</h1>
  </div>
  <div id="fw" class="fw-info">Detecting Firmware...</div>
  <div id="status" class="status-box">Checking cache...</div>
  <div id="sub" class="sub-status"></div>
</div>

<script>
(function () {
    var fwEl = document.getElementById("fw");
    var statusEl = document.getElementById("status");
    var subEl = document.getElementById("sub");

    function setStatus(text, className) {
        statusEl.textContent = text;
        statusEl.className = "status-box " + (className || "");
    }

    var params = new URLSearchParams(location.search);
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    fwEl.innerHTML = "Firmware: <b>" + (key || "Unknown") + "</b> " + (supported ? "✔" : "❌");

    var target = "jb.html" + location.search;
    function go() {
        location.replace(target);
    }

    function triggerDone() {
        setStatus("DONE", "done");
        subEl.textContent = "Loading jailbreak...";
        setTimeout(go, 1000);
    }

    if (!supported) {
        setStatus("UNSUPPORTED FIRMWARE", "bad");
        subEl.textContent = "Press X to continue anyway";
        window.addEventListener("click", go);
        window.addEventListener("keydown", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        triggerDone();
    } else if (!navigator.onLine || ac.status === ac.IDLE) {
        triggerDone();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        triggerDone();
    } else {
        ac.addEventListener("downloading", function () {
            setStatus("Caching...", "warn");
        }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total) {
                var p = Math.round((e.loaded / e.total) * 100);
                setStatus("Caching " + p + "%", "warn");
            }
        }, false);
        ac.addEventListener("cached", function () {
            triggerDone();
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            triggerDone();
        }, false);
        ac.addEventListener("noupdate", function () {
            triggerDone();
        }, false);
        ac.addEventListener("error", function () {
            triggerDone();
        }, false);
    }
})();
</script>
</body>
</html>
