<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABAS4D HOST</title>

<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #0a0c10 url('bg.jpg') no-repeat center center fixed;
    background-size: cover;
    color: #e6ebf2;
    font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(10, 12, 16, 0.75);
    z-index: 1;
  }

  .card {
    position: relative;
    z-index: 2;
    width: 90%;
    max-width: 460px;
    background: rgba(20, 24, 33, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    padding: 30px 24px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .brand-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .brand-header img {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #00ff88;
    box-shadow: 0 0 12px rgba(0, 255, 136, 0.4);
  }

  .brand-header h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #ffffff;
  }

  #state {
    font-size: 22px;
    font-weight: 700;
    margin: 10px 0 8px;
    min-height: 32px;
  }

  #det {
    font-size: 13px;
    color: #8b95a3;
    margin: 0 0 8px;
  }

  #det b {
    color: #c8ced8;
    font-weight: 600;
  }

  #cache {
    font-size: 12px;
    color: #5c6672;
    margin: 8px 0 0;
    min-height: 14px;
  }

  #cache.cacheok {
    color: #7fd0a0;
  }

  .ok {
    color: #7fd0a0;
  }

  .bad {
    color: #fc8181;
  }

  .warn {
    color: #f6ad55;
  }

  .copyright {
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 11px;
    color: #687384;
    letter-spacing: 1px;
  }

  .copyright b {
    color: #00ff88;
  }
</style>
</head>

<body>

<div class="overlay"></div>

<div class="card">

  <div class="brand-header">
    <img src="logo.png"
         alt="Logo"
         onerror="this.style.display='none'">
    <h1>ABAS4D</h1>
  </div>

  <div id="state">detecting firmware...</div>
  <div id="det"></div>
  <div id="cache"></div>

  <div class="copyright">
    © 2026 <b>ABAS4D</b> — RAW GAME
  </div>

</div>

<script>
(function () {

    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");

    function setState(t, c) {
        stateEl.textContent = t;
        stateEl.className = c || "";
    }

    function setCache(t, ok) {
        cacheEl.textContent = t;
        cacheEl.className = ok ? "cacheok" : "";
    }

    var params = new URLSearchParams(location.search);

    // Firmwares this build has a MEASURED kernel table for.
    // jb.js still runs its own kernel-table-present gate.
    // KEEP IN SYNC with ps4_offsets.js.

    var SUPPORTED = {
        1302: 1,
        1304: 1,
        1350: 1,
        1352: 1
    };

    var key = null, fwnum = null;

    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(
        navigator.userAgent
    );

    if (m) {

        var ms = parseInt(m[2], 16).toString(16);

        if (ms.length < 2)
            ms = "0" + ms;

        key = m[1] + "." + ms;

        fwnum =
            parseInt(m[1], 10) * 100 +
            parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";

    var supported =
        forced ||
        (fwnum !== null && SUPPORTED[fwnum] === 1);

    detEl.innerHTML =
        "firmware <b>" +
        (key || "unknown") +
        "</b>" +
        (supported
            ? " &middot; <b>supported</b>"
            : " &middot; not in this build's kernel table");

    var target = "jb.html" + location.search;

    function go() {
        setState("loading jailbreak...", "warn");
        location.replace(target);
    }

    function waitForTap(msg, action) {

        setState(msg, "warn");

        function fire() {

            window.removeEventListener(
                "click",
                fire
            );

            window.removeEventListener(
                "keydown",
                fire
            );

            action();
        }

        window.addEventListener(
            "click",
            fire
        );

        window.addEventListener(
            "keydown",
            fire
        );
    }

    // Off-target consoles are not launched automatically.
    if (!supported) {

        setState(
            "UNSUPPORTED FIRMWARE",
            "bad"
        );

        waitForTap(
            "UNSUPPORTED (" +
            (key || "unknown") +
            ") -- press X or tap to run anyway",
            go
        );

        return;
    }

    var ac = window.applicationCache;

    if (
        !ac ||
        !document.documentElement.hasAttribute("manifest")
    ) {

        go();

    } else if (!navigator.onLine) {

        setCache(
            "offline -- from cache",
            true
        );

        go();

    } else if (ac.status === ac.IDLE) {

        setCache(
            "cached",
            true
        );

        go();

    } else if (ac.status === ac.UPDATEREADY) {

        try {
            ac.swapCache();
        } catch (e) {}

        setCache(
            "update downloaded",
            true
        );

        waitForTap(
            "UPDATE READY -- press X or tap to reload & run",
            function () {
                location.reload();
            }
        );

    } else {

        setCache(
            "checking cache..."
        );

        ac.addEventListener(
            "downloading",
            function () {
                setCache(
                    "caching for offline (first run)..."
                );
            },
            false
        );

        ac.addEventListener(
            "progress",
            function (e) {

                if (e && e.total) {

                    setCache(
                        "caching " +
                        Math.round(
                            (e.loaded / e.total) * 100
                        ) +
                        "%"
                    );
                }

            },
            false
        );

        ac.addEventListener(
            "cached",
            function () {

                setCache(
                    "cached for offline use",
                    true
                );

                waitForTap(
                    "CACHED (first run) -- press X or tap to run",
                    go
                );

            },
            false
        );

        ac.addEventListener(
            "updateready",
            function () {

                try {
                    ac.swapCache();
                } catch (e) {}

                setCache(
                    "update downloaded",
                    true
                );

                waitForTap(
                    "UPDATE READY -- press X or tap to reload & run",
                    function () {
                        location.reload();
                    }
                );

            },
            false
        );

        ac.addEventListener(
            "noupdate",
            function () {

                setCache(
                    "cached -- offline ready",
                    true
                );

                go();

            },
            false
        );

        ac.addEventListener(
            "error",
            function () {

                setCache(
                    "cache unavailable"
                );

                waitForTap(
                    "CACHE FAILED -- press X or tap to run anyway",
                    go
                );

            },
            false
        );

        ac.addEventListener(
            "obsolete",
            function () {

                setCache(
                    "cache obsolete"
                );

                waitForTap(
                    "CACHE OBSOLETE -- press X or tap to run",
                    go
                );

            },
            false
        );
    }

})();
</script>

</body>
</html>
